# omarchy-on-cachyos: closing the lid on battery suspends first (instant wake),
# then hibernates after HibernateDelaySec so the battery can't run flat while
# asleep. Plugged in, the lid only suspends.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
